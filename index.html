<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>ddle</title>
<style>
:root{
  --bg:#111213;
  --surface:#17181a;
  --fg:#e8e6e2;
  --muted:#8b8b87;
  --faint:#5f605e;
  --line:#2b2c2e;
  --line-strong:#505155;
  --green:#4f7a55;
  --amber:#8d7a3d;
  --absent:#2a2b2d;
  --win:#8fae94;
  --lose:#b0938e;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:56px 20px 72px;
  background:var(--bg);
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  text-align:center;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
main{width:100%;max-width:480px;margin:0 auto}
header{margin-bottom:36px}
h1{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:30px;
  font-weight:400;
  letter-spacing:.01em;
  line-height:1;
}
#sub{
  margin:12px 0 0;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
}
#grid{display:flex;flex-direction:column;gap:5px;align-items:center;margin:0 0 30px}
.row{display:flex;gap:5px}
.t{
  width:40px;height:46px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);
  font-size:20px;
  font-weight:600;
  text-transform:uppercase;
  color:var(--fg);
  user-select:none;
  transition:border-color .12s ease;
}
.sp{width:18px}
.t.filled{border-color:var(--line-strong)}
.t.g{--c:var(--green)}
.t.y{--c:var(--amber)}
.t.b{--c:var(--absent)}
.t.set.g,.t.set.y,.t.set.b{background:var(--c);border-color:var(--c);color:#f4f2ee}
.t.flip{animation:flip .5s cubic-bezier(.25,.7,.3,1) forwards;animation-delay:calc(var(--i)*.14s)}
#controls{display:flex;gap:8px;justify-content:center;align-items:stretch}
input,button{font-family:inherit;font-size:14px;border-radius:4px}
input{
  width:220px;
  min-width:0;
  padding:10px 12px;
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--fg);
  transition:border-color .15s ease;
}
input::placeholder{color:var(--faint)}
input:focus{outline:none;border-color:var(--line-strong)}
button{
  padding:10px 18px;
  background:transparent;
  border:1px solid var(--line-strong);
  color:var(--fg);
  cursor:pointer;
  transition:background .15s ease,border-color .15s ease;
}
button:hover{background:var(--surface);border-color:#6a6b6f}
button:focus-visible{outline:1px solid var(--line-strong);outline-offset:2px}
input:disabled,button:disabled{opacity:.35}
button:disabled{cursor:default}
button:disabled:hover{background:transparent;border-color:var(--line-strong)}
#msg{min-height:20px;margin:18px 0 0;font-size:13px;letter-spacing:.01em;color:var(--muted)}
#msg[data-state="win"]{color:var(--win)}
#msg[data-state="lose"]{color:var(--lose)}
#end{
  display:none;
  max-width:260px;
  margin:26px auto 0;
  padding-top:20px;
  border-top:1px solid var(--line);
  text-align:center;
}
#end.show{display:block}
#end .label{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
#end .word{margin:0;font-size:17px;letter-spacing:.02em;color:var(--fg)}
@keyframes flip{
  0%{transform:rotateX(0);background:transparent;border-color:var(--line-strong)}
  45%{transform:rotateX(-90deg);background:transparent;border-color:var(--line-strong)}
  46%{transform:rotateX(-90deg);background:var(--c);border-color:var(--c)}
  100%{transform:rotateX(0);background:var(--c);border-color:var(--c)}
}
@media (max-width:520px){
  body{padding:40px 16px 56px}
  h1{font-size:26px}
  #grid{gap:4px;margin-bottom:26px}
  .row{gap:4px}
  .t{width:34px;height:40px;font-size:18px}
  .sp{width:12px}
  input{width:190px}
}
@media (max-width:380px){
  .t{width:29px;height:36px;font-size:16px}
  .sp{width:8px}
  .row{gap:3px}
  #grid{gap:3px}
  #controls{gap:6px}
  input{width:150px}
  button{padding:10px 14px}
}
@media (prefers-reduced-motion:reduce){
  .t.flip{animation:none;background:var(--c);border-color:var(--c)}
}
</style>
</head>
<body>
<main>
  <header>
    <h1>ddle</h1>
    <p id="sub"></p>
  </header>
  <div id="grid"></div>
  <div id="controls">
    <input id="in" maxlength="11" autocomplete="off" spellcheck="false" placeholder="Type your guess">
    <button id="go">Guess</button>
  </div>
  <p id="msg" role="status" aria-live="polite"></p>
  <div id="end">
    <p class="label">The answer</p>
    <p class="word" id="word"></p>
  </div>
</main>
<script>
const PATTERN = "fuck you dd", TRIES = 6;
const ANSWER = PATTERN.replace(/ /g, ''), N = ANSWER.length;
const START = new Date(2026, 10, 6); // puzzle #1

const now = new Date();
const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const num = Math.round((today - START) / 864e5) + 1;
const key = 'ddle-' + today.getFullYear() + '-' + (today.getMonth() + 1) + '-' + today.getDate();
document.getElementById('sub').textContent =
  'Puzzle #' + num + ' · ' + today.toLocaleDateString(undefined, {year:'numeric', month:'long', day:'numeric'});

const grid = document.getElementById('grid'), msg = document.getElementById('msg'),
      inp = document.getElementById('in'), btn = document.getElementById('go'),
      end = document.getElementById('end');
const rows = [], rowEls = [];
for (let r = 0; r < TRIES; r++) {
  const d = document.createElement('div'); d.className = 'row';
  const cells = [];
  for (const ch of PATTERN) {
    const s = document.createElement('div');
    if (ch === ' ') s.className = 'sp';
    else { s.className = 't'; s.style.setProperty('--i', cells.length); cells.push(s); }
    d.appendChild(s);
  }
  grid.appendChild(d); rows.push(cells); rowEls.push(d);
}

let guesses = [], done = false, busy = false;
try { guesses = JSON.parse(localStorage.getItem(key)) || []; } catch (e) {}

function score(w) {
  const res = Array(N).fill('b'), left = {};
  for (let k = 0; k < N; k++) {
    if (w[k] === ANSWER[k]) res[k] = 'g';
    else left[ANSWER[k]] = (left[ANSWER[k]] || 0) + 1;
  }
  for (let k = 0; k < N; k++) {
    if (res[k] === 'b' && left[w[k]] > 0) { res[k] = 'y'; left[w[k]]--; }
  }
  return res;
}
function say(t) { msg.textContent = t; }
function finish(won) {
  done = true; inp.disabled = btn.disabled = true;
  if (won) {
    msg.dataset.state = 'win';
    say('You got it');
  } else {
    document.getElementById('word').textContent = PATTERN;
    end.classList.add('show');
    msg.dataset.state = 'lose';
    say('Better luck tomorrow');
  }
}
function show(w, r, animate) {
  const res = score(w);
  for (let k = 0; k < N; k++) {
    const t = rows[r][k];
    t.textContent = w[k];
    t.classList.add('filled', res[k], animate ? 'flip' : 'set');
  }
  const won = w === ANSWER, lost = !won && r === TRIES - 1;
  if (won || lost) {
    if (animate) { busy = true; setTimeout(() => { busy = false; finish(won); }, N * 150 + 650); }
    else finish(won);
  } else if (animate) {
    busy = true; setTimeout(() => { busy = false; }, N * 150 + 550);
  }
}
guesses.forEach((w, r) => show(w, r, false));

function guess() {
  if (done || busy) return;
  const r = guesses.length;
  const w = inp.value.toLowerCase().replace(/[^a-z]/g, '');
  if (w.length !== N) {
    say('Need ' + N + ' letters (spaces optional)');
    return;
  }
  msg.textContent = '';
  guesses.push(w); inp.value = '';
  try { localStorage.setItem(key, JSON.stringify(guesses)); } catch (e) {}
  show(w, r, true);
}

// live preview of typing in the current row
inp.addEventListener('input', () => {
  if (done) return;
  const w = inp.value.toLowerCase().replace(/[^a-z]/g, '').slice(0, N);
  const row = rows[guesses.length];
  row.forEach((t, k) => {
    t.textContent = w[k] || '';
    t.classList.toggle('filled', !!w[k]);
  });
});
btn.onclick = guess;
inp.addEventListener('keydown', e => { if (e.key === 'Enter') guess(); });
</script>
</body>
</html>
